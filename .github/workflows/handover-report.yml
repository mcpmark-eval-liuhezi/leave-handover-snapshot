name: Handover Report

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Write one-line status file
        run: |
          echo "handover snapshot generated successfully on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > handover-status.txt
          cat handover-status.txt

      - name: Upload handover-report artifact
        uses: actions/upload-artifact@v4
        with:
          name: handover-report
          path: handover-status.txt
          if-no-files-found: error
